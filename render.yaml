services:
  - type: web
    name: apexsovereign-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: PAYPAL_BASE_URL
        value: https://api-m.paypal.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: TENANT_TOKEN_HMAC_KEYS_JSON
        sync: false
      - key: TENANT_TOKEN_CURRENT_KID
        value: 2026-09
      - key: TENANT_TOKEN_ISSUER
        value: https://apexsovereign.ai
      - key: TENANT_TOKEN_AUDIENCE
        value: apexsovereign-api
      - key: REQUIRE_PQC
        value: "false"
